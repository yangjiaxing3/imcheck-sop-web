<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220" />
  <meta name="description" content="US3C / iMCheck 通路端專員開單教學（步驟 1–5）" />
  <title>iMCheck 教學｜專員開單 1–5</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app" class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">US3C</span>
        <span class="brand-sep">·</span>
        <span class="brand-sub">iMCheck</span>
      </div>
      <div class="progress" id="progress" aria-live="polite">第 1／5</div>
    </header>

    <main class="stage">
      <div class="phone-frame" id="phoneFrame">
        <img id="stepImage" class="step-image" alt="步驟畫面" draggable="false" />
        <button type="button" id="hotspot" class="hotspot" hidden aria-label="點擊紅框區域"></button>
        <div id="tapCatcher" class="tap-catcher" aria-hidden="true"></div>
      </div>
    </main>

    <section class="panel">
      <h1 class="step-title" id="stepTitle">—</h1>
      <p class="narration" id="narration">—</p>
      <div class="actions">
        <button type="button" class="btn btn-ghost" id="btnBack" disabled>上一步</button>
        <button type="button" class="btn btn-primary" id="btnNext" hidden>下一步</button>
      </div>
      <p class="hint" id="hint">請點畫面上的紅框區域以繼續</p>
    </section>

    <div id="toast" class="toast" role="status" aria-live="assertive" hidden>請點紅框區域</div>

    <footer class="footer">
      <span>通路端訓練 · 通用商家版</span>
    </footer>
  </div>

  <div id="done" class="done" hidden>
    <div class="done-card">
      <p class="done-brand">US3C · iMCheck</p>
      <h2>章節完成</h2>
      <p>專員開單與憑證（步驟 1–5）已練習完畢。</p>
      <button type="button" class="btn btn-primary" id="btnRestart">再練一次</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
